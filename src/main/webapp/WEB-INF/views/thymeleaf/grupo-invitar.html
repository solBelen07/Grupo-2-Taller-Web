<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Invitar - FocusFlight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0914; color: #ffffff; font-family: 'Inter', sans-serif; }
        .sidebar { height: 100vh; border-right: 1px solid #2a253c; padding-top: 20px; }
        .nav-link { color: #8e8b99; margin-bottom: 8px; border-radius: 8px; padding: 10px 15px; }
        .nav-link:hover, .nav-link.active { background-color: #241c38; color: #d6b4fc; }
        .card-custom { background-color: #171324; border: 1px solid #2a253c; border-radius: 12px; }
        .btn-purple { background-color: #a855f7; color: white; border: none; border-radius: 8px; padding: 10px; font-weight: 500; }
        .btn-purple:hover { background-color: #9333ea; color: white; }
        .form-control-custom { background-color: #0b0914; border: 1px solid #2a253c; color: white; border-radius: 8px; }
        .form-control-custom:focus { background-color: #0b0914; color: white; border-color: #a855f7; box-shadow: none; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3" style="width: 250px;">
        <div class="d-flex align-items-center mb-4 px-2">
            <i class="fa-solid fa-plane-departure text-light fs-4 me-2"></i>
            <h5 class="mb-0 fw-bold">FocusFlight</h5>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link active" th:href="@{/grupos}"><i class="fa-solid fa-users me-2"></i> Grupos</a>
            <a class="nav-link" th:href="@{/invitaciones}"><i class="fa-solid fa-envelope me-2"></i> Invitaciones</a>
        </nav>
    </div>

    <div class="flex-grow-1 p-4 d-flex align-items-center justify-content-center">
        <div class="card card-custom p-4 w-100" style="max-width: 500px;">
            <div class="text-center mb-4">
                <div class="bg-secondary bg-opacity-25 d-inline-block p-3 rounded-circle text-light mb-3">
                    <i class="fa-solid fa-user-plus fs-3"></i>
                </div>
                <h4 class="fw-bold">Añadir al grupo</h4>
                <p class="text-secondary small">Estás invitando a alguien al grupo <strong class="text-light" th:text="${nombreGrupo}">Grupo</strong></p>
            </div>

            <div th:if="${error != null}" class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger rounded" th:text="${error}"></div>

            <form form action="#" th:action="@{/grupos/{nombre}/invitar(nombre=${datosGrupo.getNombre()})}" method="POST">
                <div class="mb-4">
                    <input type="hidden" name="grupo" th:value="${datosGrupo.getNombre()}">
                    <label class="form-label text-secondary small text-uppercase fw-bold">Correo del usuario</label>
                    <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0" style="border-color: #2a253c; color: #8e8b99;">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                        <input type="email" name="receptor" class="form-control form-control-custom border-start-0 ps-0" placeholder="usuario@ejemplo.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-purple w-100 mb-3"><i class="fa-solid fa-paper-plane me-2"></i> Enviar Invitación</button>
                <a th:href="@{/grupos}" class="btn btn-outline-secondary border-0 w-100">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>

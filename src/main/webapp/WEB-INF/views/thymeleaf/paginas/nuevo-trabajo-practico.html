<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabajo Práctico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>

    <main class="container">

        <div class="mb-4">
            <h1 th:text="${trabajoPractico.id == null} ? 'Nuevo trabajo práctico' : 'Editar trabajo práctico'"></h1>
            <p class="text-muted">Completá los datos de la entrega.</p>
        </div>

        <form th:action="@{/trabajos-practicos/guardar}" th:object="${trabajoPractico}"
              method="POST" accept-charset="UTF-8" class="tp-form-card">
            <input type="hidden" th:field="*{id}">

            <div class="tp-campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="tp-campo">
                <label for="materia">Materia</label>
                <select id="materia" th:field="*{materia}" required>
                    <option value="">Seleccioná una materia</option>
                    <option value="Taller Web">Taller Web</option>
                    <option value="Programación Web">Programación Web</option>
                    <option value="Base de Datos">Base de Datos</option>
                </select>
            </div>

            <div class="tp-campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
            </div>

            <div class="tp-campo">
                <label for="fechaEntrega">Fecha de entrega</label>
                <input type="date" id="fechaEntrega" th:field="*{fechaEntrega}" required>
            </div>

            <div class="tp-campo">
                <label for="tipo">Tipo</label>
                <select id="tipo" th:field="*{tipo}" required>
                    <option value="">Seleccioná una opción</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>

            <div class="tp-campo">
                <label for="estado">Estado</label>
                <select id="estado" th:field="*{estado}" required>
                    <option th:each="e : ${estados}" th:value="${e}"
                            th:text="${#strings.replace(e, '_', ' ')}"></option>
                </select>
            </div>

            <div class="tp-campo">
                <label>Disponibilidad horaria</label>
                <div class="tp-disponibilidad">
                    <div th:each="disp, stat : *{disponibilidades}" class="tp-disponibilidad-fila">
                        <input type="hidden" th:field="*{disponibilidades[__${stat.index}__].dia}">
                        <span class="tp-disponibilidad-dia" th:text="${disp.dia}"></span>
                        <div class="tp-disponibilidad-horas">
                            <input type="number" min="0" max="24"
                                   th:field="*{disponibilidades[__${stat.index}__].horas}">
                            <span>hs</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tp-form-botones">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/trabajos-practicos}" class="tp-btn-sec">Cancelar</a>
            </div>
        </form>
    </main>
</div>

</body>
</html>

<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logros obtenidos - FocusFlight</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .logro-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }
        .logro-card:hover {
            transform: translateY(-5px);
        }
        .logro-icono {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 15px auto;
        }
        .logro-bloqueado {
            opacity: 0.6;
            filter: grayscale(100%);
        }
    </style>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav('logros')}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>

    <main class="container">

        <div class="mb-4 d-flex justify-content-between align-items-end">
            <div>
                <h1>Logros obtenidos</h1>
                <p class="text-muted mb-0">Revisá tu progreso y las insignias que fuiste obteniendo.</p>
            </div>
            <div class="text-end">
            </div>
        </div>

        <div class="row g-4">

            <div th:each="logro : ${logros}" class="col-md-4 col-sm-6">
                <div class="tp-form-card logro-card text-center p-4"
                     th:classappend="${!logro.obtenido} ? 'logro-bloqueado' : ''">

                    <div class="logro-icono fs-2"
                         th:classappend="${logro.obtenido} ? 'bg-warning bg-opacity-25 text-warning' : 'bg-secondary bg-opacity-25 text-secondary'">

                        <i class="fa-solid" th:classappend="${logro.icono}"></i>
                    </div>

                    <h5 class="fw-bold text-light" th:text="${logro.nombre}">Nombre del logro</h5>
                    <p class="text-muted small" th:text="${logro.descripcion}">Descripción del logro.</p>

                    <span th:if="${logro.obtenido}" class="badge bg-success mt-2">
                        <i class="fa-solid fa-check me-1"></i> Obtenido
                    </span>
                    <span th:unless="${logro.obtenido}" class="badge bg-secondary mt-2">
                        <i class="fa-solid fa-lock me-1"></i> Bloqueado
                    </span>

                </div>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(logros)}" class="tp-form-card text-center p-5 mt-4">
            <div class="text-muted mb-3"><i class="fa-solid fa-ghost fs-1"></i></div>
            <h5 class="text-light">Sin logros creados</h5>
            <p class="text-muted mb-0">No hay insignias configuradas en el sistema todavía.</p>
        </div>

    </main>
</div>

</body>
</html>

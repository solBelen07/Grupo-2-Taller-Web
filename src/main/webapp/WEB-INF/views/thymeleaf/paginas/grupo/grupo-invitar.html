<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitar - FocusFlight</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .card-custom {
            background-color: #171324;
            border: 1px solid #2a253c;
            border-radius: 12px;
        }
        .form-control-custom {
            background-color: #0b0914 !important;
            border: 1px solid #2a253c;
            color: white !important;
            border-radius: 8px;
        }
        .form-control-custom:focus {
            border-color: #a855f7;
            box-shadow: none;
        }
        .input-group-text {
            background-color: transparent;
            border-color: #2a253c;
            color: #8e8b99;
        }
        .btn-purple {
            background-color: #a855f7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 500;
        }
        .btn-purple:hover {
            background-color: #9333ea;
            color: white;
        }
    </style>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>

    <main class="container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 100px);">

        <div class="tp-form-card card-custom p-4 w-100 shadow-sm" style="max-width: 500px;">
            <div class="text-center mb-4">
                <div class="bg-secondary bg-opacity-25 d-inline-block p-3 rounded-circle text-light mb-3">
                    <i class="fa-solid fa-user-plus fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1">Añadir al grupo</h4>
                <p class="text-muted small">Estás invitando a alguien al grupo <strong class="text-light" th:text="${nombreGrupo}">Grupo</strong></p>
            </div>

            <div th:if="${error != null}" class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger rounded mb-4" th:text="${error}"></div>

            <form th:action="@{/grupos/{nombre}/invitar(nombre=${datosGrupo.getNombre()})}" method="POST">
                <div class="mb-4">
                    <input type="hidden" name="grupo" th:value="${datosGrupo.getNombre()}">
                    <label class="form-label text-muted small text-uppercase fw-bold">Correo del usuario</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="receptor" class="form-control form-control-custom border-start-0 ps-0" placeholder="usuario@ejemplo.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-purple w-100 mb-3">
                    <i class="fa-solid fa-paper-plane me-2"></i> Enviar Invitación
                </button>
                <a th:href="@{/grupos}" class="btn btn-outline-secondary border-0 w-100 text-muted">Cancelar</a>
            </form>
        </div>

    </main>
</div>

</body>
</html>

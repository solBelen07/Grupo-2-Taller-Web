<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitaciones - FocusFlight</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .card-custom {
            background-color: #171324;
            border: 1px solid #2a253c;
            border-radius: 12px;
        }
        .btn-purple {
            background-color: #a855f7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            padding: 8px 16px;
        }
        .btn-purple:hover {
            background-color: #9333ea;
            color: white;
        }
        .badge-live {
            background-color: rgba(168, 85, 247, 0.2);
            color: #d6b4fc;
            border: 1px solid rgba(168, 85, 247, 0.5);
        }
        .btn-outline-secondary {
            color: #8e8b99;
            border-color: #2a253c;
        }
        .btn-outline-secondary:hover:not(:disabled) {
            background-color: #2a253c;
            color: white;
            border-color: #2a253c;
        }
        .btn-outline-secondary:disabled {
            background-color: transparent;
            border-color: #2a253c;
            opacity: 0.6;
        }
    </style>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>

    <main class="container">

        <div class="mb-4">
            <h1>Invitaciones</h1>
            <p class="text-muted">Gestiona las solicitudes pendientes.</p>
        </div>

        <div th:if="${exito != null}" class="alert alert-success border-0 bg-success bg-opacity-25 text-success rounded mb-4" th:text="${exito}"></div>

        <div class="row g-4">
            <div th:each="invitacion : ${datosInvitacion}" class="col-md-6">
                <div class="tp-form-card card-custom p-4 shadow-sm h-100 d-flex flex-column">

                    <div th:if="${invitacion.receptor.email == session.USUARIO.email}" class="d-flex flex-column h-100">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="badge bg-secondary bg-opacity-25 text-light border border-secondary rounded-pill px-3">Recibida</span>
                            <span class="text-muted small"><i class="fa-regular fa-clock me-1"></i> Pendiente</span>
                        </div>
                        <h5 class="fw-bold text-light" th:text="${invitacion.grupo.nombre}">Nombre del grupo</h5>
                        <p class="text-muted mb-4">Invitado por: <span class="text-light" th:text="${invitacion.emisor.email}">email</span></p>

                        <div class="d-flex gap-2 mt-auto">
                            <form th:action="@{/invitaciones/rechazar}" method="POST" class="w-50">
                                <input type="hidden" name="emisor" th:value="${invitacion.emisor.email}">
                                <input type="hidden" name="grupo" th:value="${invitacion.grupo.nombre}">
                                <input type="hidden" name="receptor" th:value="${invitacion.receptor.email}">
                                <button type="submit" class="btn btn-outline-secondary w-100">Rechazar</button>
                            </form>
                            <form th:action="@{/invitaciones/aceptar}" method="POST" class="w-50">
                                <input type="hidden" name="grupo" th:value="${invitacion.grupo.nombre}">
                                <input type="hidden" name="emisor" th:value="${invitacion.emisor.email}">
                                <input type="hidden" name="receptor" th:value="${invitacion.receptor.email}">
                                <button type="submit" class="btn btn-purple w-100">Aceptar</button>
                            </form>
                        </div>
                    </div>

                    <div th:if="${invitacion.emisor.email == session.USUARIO.email}" class="d-flex flex-column h-100">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="badge badge-live rounded-pill px-3">Enviada</span>
                        </div>
                        <h5 class="fw-bold text-light" th:text="${invitacion.grupo.nombre}">Nombre Grupo</h5>
                        <p class="text-muted mb-4">Enviada a: <span class="text-light" th:text="${invitacion.receptor.email}">email</span></p>

                        <div class="mt-auto">
                            <button class="btn btn-outline-secondary w-100" disabled>Esperando respuesta...</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(datosInvitacion)}" class="tp-form-card text-center p-5 card-custom mt-4">
            <div class="text-muted mb-3"><i class="fa-regular fa-folder-open fs-1"></i></div>
            <h5 class="text-light">No hay invitaciones</h5>
            <p class="text-muted mb-0">Tu bandeja de solicitudes está vacía.</p>
        </div>

    </main>
</div>

</body>
</html>

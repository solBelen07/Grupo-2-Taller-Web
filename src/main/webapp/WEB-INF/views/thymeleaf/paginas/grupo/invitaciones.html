<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <!-- Mismos estilos y head que en grupos.html -->
    <meta charset="UTF-8">
    <title>Invitaciones - FocusFlight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0914; color: #ffffff; font-family: 'Inter', sans-serif; }
        .sidebar { height: 100vh; border-right: 1px solid #2a253c; padding-top: 20px; }
        .nav-link { color: #8e8b99; margin-bottom: 8px; border-radius: 8px; padding: 10px 15px; }
        .nav-link:hover, .nav-link.active { background-color: #241c38; color: #d6b4fc; }
        .card-custom { background-color: #171324; border: 1px solid #2a253c; border-radius: 12px; }
        .btn-purple { background-color: #a855f7; color: white; border: none; border-radius: 8px; font-weight: 500; }
        .btn-purple:hover { background-color: #9333ea; color: white; }
        .badge-live { background-color: rgba(168, 85, 247, 0.2); color: #d6b4fc; border: 1px solid rgba(168, 85, 247, 0.5); }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3" style="width: 250px;">
        <div class="d-flex align-items-center mb-4 px-2">
            <i class="fa-solid fa-plane-departure text-light fs-4 me-2"></i>
            <h5 class="mb-0 fw-bold">FocusFlight</h5>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" th:href="@{/grupos}"><i class="fa-solid fa-users me-2"></i> Grupos</a>
            <a class="nav-link active" th:href="@{/invitaciones}"><i class="fa-solid fa-envelope me-2"></i> Invitaciones</a>
        </nav>
    </div>

    <div class="flex-grow-1 p-4">
        <h3 class="fw-bold mb-1">Mis invitaciones</h3>
        <p class="text-secondary mb-4">Gestiona las solicitudes pendientes</p>

        <div th:if="${exito != null}" class="alert alert-success border-0 bg-success bg-opacity-25 text-success rounded" th:text="${exito}"></div>

        <div class="row g-4">
            <div th:each="invitacion : ${datosInvitacion}" class="col-md-6">
                <div class="card card-custom p-4 shadow-sm h-100">
                    <div th:if="${invitacion.receptor.email == session.USUARIO.email}">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="badge bg-secondary bg-opacity-25 text-light border border-secondary rounded-pill px-3">Recibida</span>
                            <span class="text-secondary small"><i class="fa-regular fa-clock me-1"></i> Pendiente</span>
                        </div>
                        <h5 class="fw-bold text-light" th:text="${invitacion.grupo.nombre}">Nombre del grupo</h5>
                        <p class="text-secondary mb-4">Invitado por: <span class="text-light" th:text="${invitacion.emisor.email}">email</span></p>

                        <div class="d-flex gap-2 mt-auto">
                            <form th:action="@{/invitaciones/rechazar}" method="POST" class="w-50">
                                <input type="hidden" name="emisor" th:value="${invitacion.emisor.email}">
                                <input type="hidden" name="grupo" th:value="${invitacion.grupo.nombre}">
                                <input type="hidden" name="receptor" th:value="${invitacion.receptor.email}">
                                <button type="submit" class="btn btn-outline-secondary w-100">Rechazar</button>
                            </form>
                            <form th:action="@{/invitaciones/aceptar}" method="POST" class="w-50">
                                <input type="hidden" name="grupo" th:value="${invitacion.grupo.nombre}">
                                <input type="hidden" name="emisor" th:value="${invitacion.emisor.email}">
                                <input type="hidden" name="receptor" th:value="${invitacion.receptor.email}">
                                <button type="submit" class="btn btn-purple w-100">Aceptar</button>
                            </form>
                        </div>
                    </div>

                    <div th:if="${invitacion.emisor.email == session.USUARIO.email}">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="badge badge-live rounded-pill px-3">Enviada</span>
                        </div>
                        <h5 class="fw-bold text-light" th:text="${invitacion.grupo.nombre}">Nombre Grupo</h5>
                        <p class="text-secondary mb-4">Enviada a: <span class="text-light" th:text="${invitacion.receptor.email}">email</span></p>

                        <div class="mt-auto">
                            <button class="btn btn-outline-secondary w-100" disabled>Esperando respuesta...</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(datosInvitacion)}" class="text-center p-5 card-custom mt-4">
            <div class="text-secondary mb-3"><i class="fa-regular fa-folder-open fs-1"></i></div>
            <h5 class="text-light">No hay invitaciones</h5>
            <p class="text-secondary">Tu bandeja de solicitudes está vacía.</p>
        </div>
    </div>
</div>
</body>
</html>

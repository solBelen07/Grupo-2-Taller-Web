<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grupos - FocusFlight</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .card-custom {
            background-color: #171324;
            border: 1px solid #2a253c;
            border-radius: 12px;
        }
        .badge-live {
            background-color: rgba(168, 85, 247, 0.2);
            color: #d6b4fc;
            border: 1px solid rgba(168, 85, 247, 0.5);
        }
        .btn-outline-light:hover {
            background-color: #a855f7;
            border-color: #a855f7;
            color: white;
        }
        .btn-purple {
            background-color: #a855f7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
        }
        .btn-purple:hover {
            background-color: #9333ea;
            color: white;
        }
    </style>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav('grupos')}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>

    <main class="container">

        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h1>Grupos</h1>
                <p class="text-muted">Gestiona tus espacios de estudio colaborativo.</p>
            </div>
            <!-- GRP-06: alta de grupo -->
            <a th:href="@{/grupos/nuevo}" class="btn btn-purple">
                <i class="fa-solid fa-plus me-1"></i> Crear grupo
            </a>
        </div>

        <div th:if="${error != null}" class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger rounded mb-4" th:text="${error}">
            Mensaje de error.
        </div>

        <div th:if="${exito != null}" class="alert alert-success border-0 bg-success bg-opacity-25 text-success rounded mb-4" th:text="${exito}">
            Mensaje de confirmación.
        </div>

        <p th:if="${datosGrupo == null or #lists.isEmpty(datosGrupo)}" class="text-muted">
            Todavía no pertenecés a ningún grupo ni tenés invitaciones.
        </p>

        <div class="row g-4">
            <div th:each="grupo : ${datosGrupo}" class="col-md-4">
                <div class="tp-form-card card-custom h-100 p-3 shadow-sm d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="bg-secondary bg-opacity-25 p-2 rounded text-light">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <!-- GRP-06: se marca si el usuario logueado es el administrador -->
                        <span th:if="${grupo.esAdministradoPor(session.USUARIO)}" class="badge bg-warning text-dark rounded-pill px-3">
                            <i class="fa-solid fa-crown me-1"></i>Administrador/a
                        </span>
                        <span th:unless="${grupo.esAdministradoPor(session.USUARIO)}" class="badge badge-live rounded-pill px-3">Activo</span>
                    </div>

                    <h5 class="fw-bold text-light" th:text="${grupo.nombre}">Nombre del Grupo</h5>
                    <p class="text-muted small mb-4">Espacio de trabajo colaborativo.</p>

                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/grupos/{nombre}(nombre=${grupo.nombre})}" class="btn btn-purple btn-sm w-100">
                            <i class="fa-solid fa-eye me-1"></i> Ver grupo
                        </a>
                        <a th:href="@{/grupos/{nombre}/invitar(nombre=${grupo.nombre})}" class="btn btn-outline-light btn-sm w-100">
                            <i class="fa-solid fa-user-plus me-1"></i> Invitar
                        </a>
                    </div>

                    <!-- GRP-06: modificación y baja, solo para el administrador -->
                    <div th:if="${grupo.esAdministradoPor(session.USUARIO)}" class="d-flex gap-2 mt-2">
                        <a th:href="@{/grupos/{nombre}/editar(nombre=${grupo.nombre})}" class="btn btn-outline-light btn-sm w-100">
                            <i class="fa-solid fa-pen me-1"></i> Editar
                        </a>
                        <form th:action="@{/grupos/{nombre}/eliminar(nombre=${grupo.nombre})}" method="POST" class="w-100"
                              onsubmit="return confirm('¿Eliminar el grupo? Se borran sus invitaciones y sus tareas quedan sin grupo.');">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                <i class="fa-solid fa-trash me-1"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

</body>
</html>

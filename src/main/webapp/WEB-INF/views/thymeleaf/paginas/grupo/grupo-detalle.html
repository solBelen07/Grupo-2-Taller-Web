<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del Grupo - FocusFlight</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .card-custom {
            background-color: #171324;
            border: 1px solid #2a253c;
            border-radius: 12px;
        }
        .btn-purple {
            background-color: #a855f7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
        }
        .btn-purple:hover {
            background-color: #9333ea;
            color: white;
        }
        .badge-live {
            background-color: rgba(168, 85, 247, 0.2);
            color: #d6b4fc;
            border: 1px solid rgba(168, 85, 247, 0.5);
        }
        .avatar-grupo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }
        .avatar-usuario {
            width: 45px;
            height: 45px;
            background-color: #2a253c;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #8e8b99;
        }
        .lista-integrantes .integrante-item:not(:last-child) {
            border-bottom: 1px solid #2a253c;
        }
    </style>
</head>

<body>
<div th:replace="~{componentes/sidebar :: sidebar-nav('grupo-detalle')}"></div>
<div class="contenido-principal">
    <div th:replace="~{componentes/header :: header-principal}"></div>
    <main class="container">

        <!-- Mensaje de error si el grupo no fue encontrado -->
        <div th:if="${error != null}">
            <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger rounded mb-4 d-flex align-items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span th:text="${error}">Mensaje de error</span>
            </div>
            <a th:href="@{/grupos}" class="btn btn-outline-secondary border-0 text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver al listado de grupos
            </a>
        </div>

        <!-- Vista del grupo: SOLO se procesa si datosGrupo no es null -->
        <div th:if="${datosGrupo != null}">
            <div class="tp-form-card card-custom p-4 mb-4 shadow-sm d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-4">
                <div class="d-flex align-items-center gap-4">
                    <div class="avatar-grupo text-white fs-1">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h2 class="fw-bold text-light mb-0" th:text="${datosGrupo.nombre}">Nombre del Grupo</h2>
                            <span class="badge badge-live rounded-pill">Activo</span>
                        </div>
                        <p class="text-muted mb-0">
                            <i class="fa-solid fa-user-group me-1"></i><span th:text="${datosGrupo.cantidadDeIntegrantes}">0</span>
                            <span th:text="${datosGrupo.cantidadDeIntegrantes == 1} ? 'integrante' : 'integrantes'">integrantes</span>
                        </p>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/grupos}" class="btn btn-outline-secondary border-0 text-muted">
                        <i class="fa-solid fa-arrow-left me-1"></i> Volver
                    </a>
                    <a th:href="@{/grupos/{nombre}/invitar(nombre=${datosGrupo.nombre})}" class="btn btn-purple">
                        <i class="fa-solid fa-user-plus me-1"></i> Invitar
                    </a>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="tp-form-card card-custom shadow-sm">
                        <div class="p-4 border-bottom" style="border-color: #2a253c !important;">
                            <h5 class="fw-bold text-light mb-0">Integrantes del grupo</h5>
                        </div>
                        <div class="lista-integrantes">
                            <!-- Integrantes reales del grupo (antes eran "Tú" y "Juan Pérez" escritos a mano) -->
                            <div th:each="integrante : ${datosGrupo.integrantes}"
                                 th:with="esVos=${session.USUARIO != null and integrante.email == session.USUARIO.email}"
                                 class="integrante-item d-flex align-items-center justify-content-between p-4">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="avatar-usuario fs-5">
                                        <i class="fa-solid" th:classappend="${esVos} ? 'fa-user-astronaut' : 'fa-user'"></i>
                                    </div>
                                    <div>
                                        <h6 class="text-light mb-0 fw-bold"
                                            th:text="${integrante.nombre + ' ' + integrante.apellido} + (${esVos} ? ' (vos)' : '')">Nombre Apellido</h6>
                                        <small class="text-muted" th:text="${integrante.email}">email@ejemplo.com</small>
                                    </div>
                                </div>
                                <div>
                                    <!-- GRP-06: el creador del grupo es el administrador -->
                                    <span th:if="${integrante.administrador}" class="badge bg-warning text-dark rounded-pill px-3">
                                        <i class="fa-solid fa-crown me-1"></i>Administrador/a
                                    </span>
                                    <span th:unless="${integrante.administrador}" class="badge bg-secondary bg-opacity-25 text-light border border-secondary rounded-pill px-3">Miembro</span>
                                </div>
                            </div>
                            <p th:if="${#lists.isEmpty(datosGrupo.integrantes)}" class="text-muted p-4 mb-0">
                                Este grupo todavía no tiene integrantes confirmados.
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 mt-4 mt-lg-0">
                    <div class="tp-form-card card-custom p-4 shadow-sm h-100 d-flex flex-column">
                        <h5 class="fw-bold text-light mb-4">Opciones</h5>

                        <ul class="list-unstyled mb-0 d-flex flex-column gap-3 mt-auto">
                            <li>
                                <button class="btn btn-outline-secondary w-100 text-start border-0">
                                    <i class="fa-solid fa-pen text-muted me-2"></i> Editar nombre del grupo
                                </button>
                            </li>
                            <li>
                                <button class="btn btn-outline-danger w-100 text-start border-0 bg-danger bg-opacity-10">
                                    <i class="fa-solid fa-door-open me-2"></i> Salir del grupo
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

</body>
</html>

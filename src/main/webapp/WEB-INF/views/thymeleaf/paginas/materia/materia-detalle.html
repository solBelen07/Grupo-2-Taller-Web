<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de materia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav('materias')}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <h1>Detalle de la materia</h1>
                <p class="text-muted">Información de la materia seleccionada.</p>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="materia-color" th:style="'background-color:' + ${materia.color}">
                                <span th:text="${#strings.substring(materia.nombre, 0, 1)}">M</span>
                            </div>
                            <div>
                                <h2 class="mb-1" th:text="${materia.nombre}">
                                    Nombre materia
                                </h2>
                                <p class="mb-0 text-muted">
                                    Docente:
                                    <span th:text="${materia.docente}">
                                        Docente
                                    </span>
                                </p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <h5>Descripción</h5>
                            <p th:text="${materia.descripcion}">Descripción de la materia</p>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <h5>Días de cursada</h5>
                                <p th:text="${materia.dias}">Lunes y Miércoles</p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <h5>Horario</h5>
                                <p th:text="${materia.horario}">
                                    18:00 - 22:00
                                </p>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h5>Material bibliográfico</h5>
                            <p th:text="${materia.materialBibliografico}">
                                Material bibliográfico
                            </p>
                        </div>

                        <div class="d-flex gap-2">
                            <a th:href="@{/materias}" class="btn btn-secondary">
                                Volver
                            </a>
                            <a th:href="@{/materias/editar(id=${materia.id})}" class="btn btn-primary">
                                Editar materia
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>

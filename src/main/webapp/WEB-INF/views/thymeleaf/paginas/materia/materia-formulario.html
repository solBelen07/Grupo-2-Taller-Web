<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Materia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav('materias')}"></div>

<div class="contenido-principal">
    <div th:replace="~{componentes/header :: header-principal}"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 th:text="${datosMateria.id == null} ? 'Nueva materia' : 'Editar materia'">
                    Materia
                </h1>
                <p class="text-muted">Completá los datos de la materia.</p>
                <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
                <form th:object="${datosMateria}" th:action="${datosMateria.id == null} ? @{/materias/guardar} : @{/materias/modificar}" enctype="multipart/form-data" method="POST">
                    
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre de la materia
                        </label>
                        <input id="nombre" type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Taller Web I" required>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            Descripción
                        </label>
                        <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="4" placeholder="Descripción de la materia..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="docente" class="form-label">
                            Docente
                        </label>
                        <input id="docente" type="text" th:field="*{docente}" class="form-control" placeholder="Ej: Martín Kowalski">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="dias" class="form-label">
                                Días de cursada
                            </label>
                            <input id="dias" type="text" th:field="*{dias}" class="form-control" placeholder="Ej: Lunes y Miércoles">
                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="horario" class="form-label">
                                Horario
                            </label>
                            <input id="horario" type="text" th:field="*{horario}" class="form-control" placeholder="Ej: 18:00 - 22:00">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="color" class="form-label">
                            Color identificativo
                        </label>
                        <input id="color" type="color" th:field="*{color}" class="form-control form-control-color">
                        <small class="text-muted">
                            Este color se utilizará para identificar la materia.
                        </small>
                    </div>

                    <div class="mb-4">
                        <label for="archivos" class="form-label">
                            Adjuntar archivos (opcional)
                        </label>
                    
                        <input type="file" id="archivos" name="archivos" class="form-control" accept=".pdf,.doc,.docx" multiple >
                    
                        <small class="text-muted">
                            Podés seleccionar varios archivos PDF o Word.
                        </small>
                    
                        <div id="archivos-seleccionados" class="mt-3"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button th:href="@{/materias/guardar}" type="submit" class="btn btn-primary" th:text="${datosMateria.id == null} ? 'Crear materia' : 'Guardar cambios'">
                            Guardar
                        </button>
                        <a th:href="@{/materias}" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>

                <div th:if="${datosMateria.id != null}" class="mt-4">

                    <h5>Material bibliográfico cargado</h5>
                                
                    <div th:each="material : ${materiales}" class="d-flex justify-content-between align-items-center mb-2">
                    
                        <a th:href="@{/materias/material/{id}(id=${material.id})}" th:text="${material.nombreArchivo}" target="_blank" rel="noopener noreferrer">
                        </a>
                    
                        <form th:action="@{/materias/material/eliminar}" method="POST" onsubmit="return confirm('¿Eliminar archivo?');">
                        
                            <input type="hidden" name="id" th:value="${material.id}">
                        
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                Eliminar
                            </button>
                        </form>
                    
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"
></script>
<script>
    
    const inputArchivos = document.getElementById("archivos");
    const listaArchivos = document.getElementById("archivos-seleccionados");
    
    const archivosAcumulados = new DataTransfer();
    
    inputArchivos.addEventListener("change", function (evento) {
    
        for (const archivo of evento.target.files) {
        
            const repetido = Array.from(archivosAcumulados.files
            ).some(existente => existente.name === archivo.name && existente.size === archivo.size && existente.lastModified === archivo.lastModified);
        
            if (!repetido) {
                archivosAcumulados.items.add(archivo);
            }
        }
    
        actualizarLista();
    });
    
    function eliminarArchivoSeleccionado(indice) {
    
        archivosAcumulados.items.remove(indice);
    
        actualizarLista();
    }
    
    function actualizarLista() {
    
        inputArchivos.files = archivosAcumulados.files;
    
        listaArchivos.innerHTML = "";
    
        Array.from(archivosAcumulados.files).forEach(
            (archivo, indice) => {
            
                const fila = document.createElement("div");
                fila.className = "d-flex justify-content-between align-items-center mb-2";
            
                const nombre = document.createElement("span");
                nombre.textContent = archivo.name;
            
                const boton = document.createElement("button");
                boton.type = "button";
                boton.className = "btn btn-outline-danger btn-sm";
                boton.textContent = "Quitar";
            
                boton.addEventListener("click", function () {
                    eliminarArchivoSeleccionado(indice);
                });
            
                fila.appendChild(nombre);
                fila.appendChild(boton);
            
                listaArchivos.appendChild(fila);
            }
        );
    }

</script>
</body>
</html>

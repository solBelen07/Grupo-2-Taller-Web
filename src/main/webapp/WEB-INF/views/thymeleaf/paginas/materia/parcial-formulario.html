<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Parcial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav('parciales')}"></div>

<div class="contenido-principal">
    <div th:replace="~{componentes/header :: header-principal}"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
            <h1>Planificar parcial</h1>

                <form th:action="@{/parciales/guardar}" th:object="${datosParcial}" method="post" class="mb-4">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre del parcial
                        </label>
                        <input id="nombre" type="text" th:field="*{nombre}" placeholder="Ej: Primer parcial" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="materia" class="form-label">
                            Materia
                        </label>

                        <select id="materia" th:field="*{materiaId}" class="form-control" required>
                            <option value="">
                                Seleccionar materia
                            </option>
                            <option th:each="materia : ${materias}" th:value="${materia.id}" th:text="${materia.nombre}" class="form-control"></option>
                        </select>

                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fecha" class="form-label">
                                Fecha del parcial
                            </label>
                            <input id="fecha" type="date" th:field="*{fecha}" class="form-control" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="horario" class="form-label">
                                Horario
                            </label>
                            <input id="horario" type="time" th:field="*{horario}" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="dias" class="form-label">
                                Cantidad de días que querés estudiar
                            </label>
                            <input id="dias" type="number" min="1" th:field="*{cantidadDiasEstudio}" class="form-control" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="horas" class="form-label">
                                Horas de estudio por día
                            </label>
                            <input id="horas" type="number" min="1" th:field="*{horasPorDia}" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Temas a estudiar
                        </label>
                        <div id="lista-temas">
                            <div class="input-group mb-2">
                                <input type="text" name="temas[0]" class="form-control" placeholder="Ej: Normalización">
                                <button type="button" class="btn btn-outline-danger" onclick="eliminarTema(this)">
                                    ×
                                </button>                
                            </div>                        
                        </div>
                        <button type="button" class="btn btn-outline-primary" onclick="agregarTema()">
                            + Agregar tema
                        </button>
                    </div>
                    <br>
                    <br>
                    <button type="submit" class="btn btn-primary">
                        Crear planificación
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous">
</script>
<script>

    let indiceTema = 1;

    function agregarTema() {

        const lista = document.getElementById("lista-temas");

        const nuevoTema = document.createElement("div");

        nuevoTema.classList.add(
            "input-group",
            "mb-2"
        );

        nuevoTema.innerHTML = `
            <input
                type="text"
                name="temas[${indiceTema}]"
                class="form-control"
                placeholder="Ingresá otro tema"
                required>

            <button
                type="button"
                class="btn btn-outline-danger"
                onclick="eliminarTema(this)">
                ×
            </button>
        `;

        lista.appendChild(nuevoTema);

        indiceTema++;
    }


    function eliminarTema(boton) {

        boton.parentElement.remove();

    }

</script>
</body>
</html>

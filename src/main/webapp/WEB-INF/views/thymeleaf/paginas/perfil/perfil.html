<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav('perfil')}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>

    <main class="container">

        <div class="mb-4">
            <h1>Mi perfil</h1>
            <p class="text-muted">Consultá y actualizá tus datos personales y académicos.</p>
        </div>

        <div th:if="${mensaje != null}" class="perfil-aviso perfil-ok" th:text="${mensaje}"></div>
        <div th:if="${error != null}" class="perfil-aviso perfil-error" th:text="${error}"></div>

        <div class="perfil-grilla">

            <!-- ===== Columna izquierda: foto y resumen ===== -->
            <aside class="perfil-card perfil-lateral">
                <div class="perfil-foto">
                    <img th:if="${tieneFoto}" th:src="@{/perfil/foto(v=${fotoVersion})}" alt="Foto de perfil">
                    <span th:unless="${tieneFoto}"
                          th:text="${(#strings.isEmpty(perfil.nombre) ? '' : #strings.substring(perfil.nombre,0,1)) + (#strings.isEmpty(perfil.apellido) ? '' : #strings.substring(perfil.apellido,0,1))}">JM</span>
                </div>

                <h2 class="perfil-nombre" th:text="${perfil.nombre + ' ' + perfil.apellido}">Nombre Apellido</h2>
                <p class="perfil-email" th:text="${perfil.email}">email</p>

                <form th:action="@{/perfil/foto}" method="POST" enctype="multipart/form-data" class="perfil-foto-form">
                    <label class="tp-btn-sec perfil-archivo">
                        <i class="fa-solid fa-camera"></i>
                        <span th:text="${tieneFoto ? 'Cambiar foto' : 'Agregar foto'}">Agregar foto</span>
                        <input type="file" name="foto" accept="image/jpeg,image/png,image/webp"
                               onchange="this.form.submit()">
                    </label>
                </form>

                <form th:if="${tieneFoto}" th:action="@{/perfil/foto/eliminar}" method="POST"
                      onsubmit="return confirm('¿Eliminar tu foto de perfil?');">
                    <button type="submit" class="tp-btn-sec perfil-eliminar">
                        <i class="fa-solid fa-trash"></i> Eliminar foto
                    </button>
                </form>

                <hr class="perfil-sep">

                <dl class="perfil-resumen">
                    <dt>Universidad</dt>
                    <dd th:text="${perfil.universidad != null ? perfil.universidad.nombre : 'Sin definir'}">UNLaM</dd>
                    <dt>Carrera</dt>
                    <dd th:text="${perfil.carrera != null ? perfil.carrera.nombre : 'Sin definir'}">Ingeniería</dd>
                    <dt>Intereses</dt>
                    <dd>
                        <span th:each="i : ${perfil.intereses}" class="perfil-etiqueta" th:text="${i.nombre}">Java</span>
                        <span th:if="${#lists.isEmpty(perfil.intereses)}" class="text-muted">Sin intereses</span>
                    </dd>
                </dl>
            </aside>

            <!-- ===== Columna derecha: formularios ===== -->
            <section class="perfil-formularios">

                <form th:action="@{/perfil/datos}" th:object="${datos}" method="POST"
                      accept-charset="UTF-8" class="perfil-card">
                    <h2 class="perfil-titulo">Datos personales y académicos</h2>

                    <div class="perfil-fila">
                        <div class="perfil-campo">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" required>
                        </div>
                        <div class="perfil-campo">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" th:field="*{apellido}" required>
                        </div>
                    </div>

                    <div class="perfil-campo">
                        <label for="emailLectura">Email</label>
                        <input type="email" id="emailLectura" th:value="${perfil.email}" disabled>
                        <small class="text-muted">El email no se puede modificar.</small>
                    </div>

                    <div class="perfil-fila">
                        <div class="perfil-campo">
                            <label for="universidadId">Universidad</label>
                            <select id="universidadId" th:field="*{universidadId}" required>
                                <option value="">Seleccioná una universidad</option>
                                <option th:each="u : ${universidades}" th:value="${u.id}" th:text="${u.nombre}"></option>
                            </select>
                        </div>
                        <div class="perfil-campo">
                            <label for="carreraId">Carrera</label>
                            <select id="carreraId" th:field="*{carreraId}" required>
                                <option value="">Seleccioná una carrera</option>
                                <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.nombre}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="perfil-campo">
                        <label>Intereses</label>
                        <div class="perfil-intereses">
                            <label th:each="i : ${intereses}" class="perfil-chip">
                                <input type="checkbox" name="interesesIds" th:value="${i.id}"
                                       th:checked="${datos.interesesIds.contains(i.id)}">
                                <span th:text="${i.nombre}">Java</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </form>

                <form th:action="@{/perfil/password}" th:object="${cambioPassword}" method="POST"
                      accept-charset="UTF-8" class="perfil-card">
                    <h2 class="perfil-titulo">Cambiar contraseña</h2>

                    <div class="perfil-campo">
                        <label for="actual">Contraseña actual</label>
                        <input type="password" id="actual" th:field="*{actual}"
                               autocomplete="current-password" required>
                    </div>

                    <div class="perfil-fila">
                        <div class="perfil-campo">
                            <label for="nueva">Nueva contraseña</label>
                            <input type="password" id="nueva" th:field="*{nueva}" minlength="8"
                                   autocomplete="new-password" required>
                        </div>
                        <div class="perfil-campo">
                            <label for="confirmacion">Repetir nueva contraseña</label>
                            <input type="password" id="confirmacion" th:field="*{confirmacion}" minlength="8"
                                   autocomplete="new-password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
                </form>
            </section>
        </div>
    </main>
</div>

</body>
</html>

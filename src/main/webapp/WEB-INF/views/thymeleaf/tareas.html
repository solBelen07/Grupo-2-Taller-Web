<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Seguimiento de tareas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

</head>

<body>

    <div class="container mt-5">
        <h1 class="mb-4">Seguimiento de tareas</h1>


        <!-- PROGRESO DEL GRUPO -->
        <div class="card mb-4">
            <div class="card-body">

                <h2 class="h4">Progreso del grupo</h2>

                <div class="progress mb-2" role="progressbar">
                    <div class="progress-bar" th:style="|width: ${progreso}%;|" th:text="${progreso + '%'}">
                    </div>
                </div>

                <p class="mb-0">
                    <strong th:text="${completadas}">0</strong>
                    tareas completadas de
                    <strong th:text="${total}">0</strong>
                </p>

            </div>
        </div>


        <!-- INDICADORES GENERALES -->
        <div class="row mb-4">

            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 class="h5">Total</h3>
                        <p class="fs-3" th:text="${total}">0</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 class="h5">Completadas</h3>
                        <p class="fs-3" th:text="${completadas}">0</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h3 class="h5">Pendientes</h3>
                        <p class="fs-3" th:text="${pendientes}">0</p>
                    </div>
                </div>
            </div>

        </div>


        <!-- APORTE INDIVIDUAL -->
        <div class="card mb-4">
            <div class="card-body">

                <h2 class="h4">Aporte individual</h2>

                <ul class="list-group">

                    <li class="list-group-item d-flex justify-content-between" th:each="aporte : ${aporteIndividual}">

                        <span th:text="${aporte.key}">Usuario</span>

                        <span>
                            <strong th:text="${aporte.value}">0</strong>
                            tareas completadas
                        </span>

                    </li>

                </ul>

            </div>
        </div>


        <!-- CREAR TAREA -->
        <div class="card mb-4">

            <div class="card-body">

                <h2 class="h4 mb-3">Nueva tarea</h2>


                <form action="/spring/tareas/crear" method="post" accept-charset="UTF-8">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">
                            Título
                        </label>

                        <input type="text" class="form-control" id="titulo" name="titulo" required>
                    </div>

                    <div class="mb-3">
                        <label for="materia" class="form-label">
                            Materia
                        </label>

                        <select class="form-select" id="materia" name="materia" required>

                            <option value="">Seleccionar materia</option>
                            <option value="Programación Web">Programacion Web</option>
                            <option value="Taller Web I">Taller Web I</option>
                            <option value="Base de Datos">Base de Datos</option>
                            <option value="Diseño de Interfaces">Diseño de Interfaces</option>
                            <option value="Inglés">Ingles</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="tipo" class="form-label">
                            Tipo de actividad
                        </label>

                        <select class="form-select" id="tipo" name="tipo" required>

                            <option value="">Seleccionar tipo</option>
                            <option value="PARCIAL">Parcial</option>
                            <option value="TP">Trabajo Práctico</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">
                            Estado
                        </label>

                        <select class="form-select" id="estado" name="estado" required>

                            <option value="PENDIENTE">
                                Pendiente
                            </option>

                            <option value="COMPLETADA">
                                Completada
                            </option>

                        </select>
                    </div>


                    <div class="mb-3">
                        <label for="responsable" class="form-label">
                            Responsable
                        </label>

                        <input type="text" class="form-control" id="responsable" name="responsable" required>
                    </div>
                    <div class="mb-3">
                        <label for="fechaVencimiento" class="form-label">
                            Fecha de vencimiento
                        </label>

                        <input type="date" class="form-control" id="fechaVencimiento" name="fechaVencimiento" required>
                    </div>

                    <div class="mb-3">
                        <label for="horasPlanificadas" class="form-label">
                            Horas planificadas
                        </label>

                        <input type="number" class="form-control" id="horasPlanificadas" name="horasPlanificadas"
                            min="0" required>
                    </div>


                    <div class="mb-3">
                        <label for="horasRealizadas" class="form-label">
                            Horas realizadas
                        </label>

                        <input type="number" class="form-control" id="horasRealizadas" name="horasRealizadas" min="0"
                            required>
                    </div>


                    <button type="submit" class="btn btn-primary">Crear tarea</button>


                </form>

            </div>

        </div>


        <!-- LISTADO DE TAREAS -->
        <div class="card">

            <div class="card-body">

                <h2 class="h4">Tareas</h2>

                <div class="table-responsive">

                    <table class="table table-striped">

                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Responsable</th>
                                <th>Horas</th>
                                <th>Indicador</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="tarea : ${tareas}">
                                <td th:text="${tarea.titulo}">Tarea</td>
                                <td th:text="${tarea.tipo}">Tipo</td>
                                <td th:text="${tarea.estado}">Estado</td>
                                <td th:text="${tarea.responsable}">Responsable</td>
                                <td th:text="${tarea.horasRealizadas + ' / ' + tarea.horasPlanificadas}">
                                    0 / 0
                                </td>
                                <td th:text="${indicadores[tarea.id]}">
                                    Indicador
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</body>

</html>

<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parciales</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav}"></div>

<div class="contenido-principal">

    <div th:replace="~{componentes/header :: header-principal}"></div>

    <main class="container">

        <!-- ENCABEZADO -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1>Parciales</h1>
                <p class="text-muted">
                    Administrá tus próximos parciales y planes de estudio.
                </p>
            </div>

            <a th:href="@{/parciales/nuevo}" class="btn btn-primary">
                + Agregar parcial
            </a>

        </div>
        <!-- SIN PARCIALES -->
        <div th:if="${parciales == null or parciales.isEmpty()}" class="alert alert-info">
            Todavía no tenés parciales cargados.
        </div>
        <!-- LISTADO -->
        <div th:each="parcial : ${parciales}" class="parcial-plan-card mb-4">
            <!-- CABECERA DEL PARCIAL -->

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h3>
                        Plan —
                        <span th:text="${parcial.materia.nombre}">
                            Base de Datos II
                        </span>
                        <span th:text="${parcial.nombre}">
                            Parcial 1
                        </span>
                    </h3>
                </div>
                <div class="parcial-fecha">
                    <span th:text="${parcial.fecha}">
                        16/09/2026
                    </span>-<span th:text="${parcial.horario}">
                        10:00
                    </span>
                </div>
            </div>
            <!-- PROGRESO -->
            <div class="d-flex justify-content-between mb-1">
                <span>Progreso del plan</span>
                <span>
                    <strong th:text="${parcial.porcentajeCompletado}">40</strong>%
                </span>
            </div>

            <div class="progress mb-4">
                <div class="progress-bar" role="progressbar" th:style="'width:' + ${parcial.porcentajeCompletado} + '%'"></div>
            </div>

            <!-- SESIONES -->
            <div class="sesiones">

                <div th:each="sesion : ${parcial.sesiones}" class="sesion-estudio">
                    <div class="sesion-check">
                        <input type="checkbox" th:checked="${sesion.completada}">
                    </div>
                    <div class="sesion-contenido">
                        <div class="sesion-datos">
                            <span th:text="${sesion.fecha}">
                                11 Sep
                            </span>
                            <span th:text="${sesion.cantidadHoras + ' h'}">
                                2 h
                            </span>
                        </div>
                        <div class="sesion-tema" th:classappend="${sesion.completada} ? 'completada' : ''">
                            <span th:text="${sesion.tema}">
                                Normalización y Álgebra Relacional
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"
></script>
</body>
</html>

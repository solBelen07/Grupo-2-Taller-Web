<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Fragmento del Header Superior -->
<header th:fragment="header-principal" class="header-navbar">
    <!-- Buscador -->
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
        <input type="text" placeholder="Buscar asignaturas, tareas, exámenes..." />
    </div>

    <!-- Widget de Estado / Streak y Perfil -->
    <!-- El usuario sale siempre de la sesión, así se ve igual en todas las páginas -->
    <div class="user-widgets"
         th:with="u=${session.USUARIO},
                  dias=${u != null and u.racha != null and u.racha.rachaActual != null ? u.racha.rachaActual : 0}">
        <div class="streak-badge">
            <i class="fa-solid fa-fire text-purple-400"></i>
            <span th:text="'Racha de ' + ${dias} + (${dias == 1} ? ' día' : ' días')">Racha de 0 días</span>
        </div>

        <div class="avatar-circle"
             th:text="${u == null ? '' : (#strings.isEmpty(u.nombre) ? '' : #strings.substring(u.nombre,0,1)) + (#strings.isEmpty(u.apellido) ? '' : #strings.substring(u.apellido,0,1))}">
        </div>
    </div>
</header>

</body>
</html>

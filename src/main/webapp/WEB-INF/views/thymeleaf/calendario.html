<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="|${calendario.titulo} · Taller Web I|">Calendario · Taller Web I</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
  </head>
  <body class="app-shell">
    <div th:replace="~{componentes/sidebar :: sidebar-nav}"></div>

    <div class="app-content">
      <div th:replace="~{componentes/header :: header-principal}"></div>

      <main class="calendario-main" id="calendario">
        <div
          th:if="${error}"
          class="alert alert-warning"
          role="alert"
          data-testid="error"
          th:text="${error}"
        ></div>

        <div class="calendario-barra">
          <h1
            class="calendario-titulo"
            data-testid="titulo-periodo"
            th:text="${calendario.titulo}"
          >
            septiembre de 2026
          </h1>

          <nav class="calendario-controles" aria-label="Navegación del calendario">
            <div class="grupo-botones" role="group" aria-label="Ir a otro período">
              <a
                class="btn-icono"
                data-testid="anterior"
                aria-label="Período anterior"
                th:href="@{/calendario(vista=${vista},fecha=${calendario.anterior})}"
                ><i class="fa-solid fa-chevron-left"></i
              ></a>
              <a
                class="btn-pill"
                data-testid="hoy"
                th:href="@{/calendario(vista=${vista},fecha=${calendario.hoy})}"
                >Hoy</a
              >
              <a
                class="btn-icono"
                data-testid="siguiente"
                aria-label="Período siguiente"
                th:href="@{/calendario(vista=${vista},fecha=${calendario.siguiente})}"
                ><i class="fa-solid fa-chevron-right"></i
              ></a>
            </div>
            <div class="grupo-botones" role="group" aria-label="Tipo de vista">
              <a
                class="btn-pill"
                data-testid="ver-mes"
                th:classappend="${vista == 'mes'} ? 'activo'"
                th:aria-current="${vista == 'mes'} ? 'page'"
                th:href="@{/calendario(vista='mes',fecha=${fecha})}"
                >Mes</a
              >
              <a
                class="btn-pill"
                data-testid="ver-semana"
                th:classappend="${vista == 'semana'} ? 'activo'"
                th:aria-current="${vista == 'semana'} ? 'page'"
                th:href="@{/calendario(vista='semana',fecha=${fecha})}"
                >Semana</a
              >
            </div>
          </nav>
        </div>

        <ul class="calendario-leyenda" aria-label="Materias" data-testid="leyenda">
          <li
            class="leyenda-item"
            th:each="materia : ${calendario.materias}"
            th:style="|--materia:${materia.color}|"
          >
            <span class="punto" aria-hidden="true"></span>
            <span th:text="${materia.nombre}">Materia</span>
            <span class="cuenta" th:text="${materia.cantidadEventos}">3</span>
          </li>
        </ul>

        <ul
          class="calendario-leyenda-estados"
          aria-label="Estados de seguimiento"
          data-testid="leyenda-estados"
        >
          <li><span class="punto-leyenda estado-EN_TIEMPO" aria-hidden="true"></span>En tiempo</li>
          <li>
            <span class="punto-leyenda estado-PROXIMA_A_VENCER" aria-hidden="true"></span>Próxima
            a vencer
          </li>
          <li><span class="punto-leyenda estado-VENCIDA" aria-hidden="true"></span>Vencida</li>
          <li>
            <span class="punto-leyenda estado-COMPLETADA" aria-hidden="true"></span>Completada
          </li>
          <li>
            <span class="punto-leyenda estado-PARCIALMENTE_COMPLETADA" aria-hidden="true"></span
            >Parcialmente completada
          </li>
        </ul>

        <p class="calendario-vacio" th:if="${calendario.vacio}" data-testid="sin-eventos">
          No hay eventos en este período.
        </p>

        <th:block th:if="${vista == 'mes'}">
          <div th:replace="~{componentes/calendario-mes :: mes}"></div>
        </th:block>
        <th:block th:if="${vista == 'semana'}">
          <div th:replace="~{componentes/calendario-semana :: semana}"></div>
        </th:block>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script type="module" th:src="@{js/calendario.js}"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Parcial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<body>

<div th:replace="~{componentes/sidebar :: sidebar-nav}"></div>

<div th:replace="~{componentes/header :: header-principal}"></div>

<main>

    <h1>Planificar parcial</h1>

    <form
        th:action="@{/parciales/guardar}"
        th:object="${datosParcial}"
        method="post">

        <div>
            <label for="nombre">
                Nombre del parcial
            </label>

            <input
                id="nombre"
                type="text"
                th:field="*{nombre}"
                placeholder="Ej: Primer parcial"
                required>
        </div>

        <div>
            <label for="materia">
                Materia
            </label>

            <select
                id="materia"
                th:field="*{materiaId}"
                required>

                <option value="">
                    Seleccionar materia
                </option>

                <option
                    th:each="materia : ${materias}"
                    th:value="${materia.id}"
                    th:text="${materia.nombre}">
                </option>

            </select>

        </div>

        <div>
            <label for="fecha">
                Fecha del parcial
            </label>

            <input
                id="fecha"
                type="date"
                th:field="*{fecha}"
                required>
        </div>

        <div>
            <label for="horario">
                Horario
            </label>

            <input
                id="horario"
                type="time"
                th:field="*{horario}"
                required>
        </div>

        <div>
            <label for="dias">
                Cantidad de días que querés estudiar
            </label>

            <input
                id="dias"
                type="number"
                min="1"
                th:field="*{cantidadDiasEstudio}"
                required>
        </div>

        <div>
            <label for="horas">
                Horas de estudio por día
            </label>

            <input
                id="horas"
                type="number"
                min="1"
                th:field="*{horasPorDia}"
                required>
        </div>

        <div>
            <label for="temas">
                Temas a estudiar
            </label>

            <textarea
                id="temas"
                th:field="*{temas}"
                placeholder="Ej: Spring MVC, Hibernate, Thymeleaf">
            </textarea>
        </div>

        <button type="submit">
            Crear planificación
        </button>

    </form>

</main>

</body>
</html>

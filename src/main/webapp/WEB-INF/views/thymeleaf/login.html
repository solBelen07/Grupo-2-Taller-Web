<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body class="login-body">

<main class="login-contenedor">

    <div class="login-marca">
        <i class="fa-solid fa-plane-up login-marca-icono"></i>
        <h1>FocusFlight</h1>
        <p>Iniciá sesión para continuar.</p>
    </div>

    <form th:action="@{/validar-login}" th:object="${datosLogin}" method="POST"
          accept-charset="UTF-8" class="login-card">

        <div th:if="${error != null}" class="login-error" th:text="${error}">Error</div>

        <div class="login-campo">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="username" required>
            <small id="email-error" class="input-error-msg" style="display: none;">Ingresá un correo electrónico válido.</small>
        </div>

        <div class="login-campo">
            <label for="password">Contraseña</label>
            <div class="password-container" style="position: relative;">
                <input type="password" id="password" th:field="*{password}"
                       autocomplete="current-password" required style="width: 100%;">
                <button type="button" id="btn-toggle-password" class="btn-toggle-password" title="Mostrar contraseña">
                    <i class="fa-regular fa-eye" id="icon-eye"></i>
                </button>
            </div>
            <small id="password-error" class="input-error-msg" style="display: none;">Debe tener al menos 8 caracteres.</small>
            <small id="caps-lock-warning" class="caps-lock-alerta" style="display: none;">
                <i class="fa-solid fa-triangle-exclamation"></i> Mayúsculas activadas
            </small>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary login-boton">Ingresar</button>

        <p class="login-registro">
            ¿No tenés cuenta? <a th:href="@{/registro}">Registrate</a>
        </p>
    </form>
</main>
<script type="module" th:src="@{/js/login.js}"></script>
</body>
</html>

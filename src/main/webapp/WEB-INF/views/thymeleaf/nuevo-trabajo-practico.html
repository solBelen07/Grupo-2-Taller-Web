<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabajo Práctico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 th:text="${trabajoPractico.id == null} ? 'Nuevo trabajo práctico' : 'Editar trabajo práctico'"></h1>

    <form th:action="@{/trabajos-practicos/guardar}" th:object="${trabajoPractico}" method="POST">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Materia</label>
            <input type="text" th:field="*{materia}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select th:field="*{tipo}" class="form-select" required>
                <option value="">Seleccioná una opción</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select th:field="*{estado}" class="form-select" required>
                <option th:each="e : ${estados}" th:value="${e}"
                        th:text="${#strings.replace(e, '_', ' ')}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/trabajos-practicos}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</main>
</body>
</html>
